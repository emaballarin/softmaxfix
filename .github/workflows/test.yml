name: Tests

# Manual runs only for now: the CPU suites take tens of minutes. The tolerance files were calibrated on a
# development build of jax and on torch 2.14.1 + CUDA 12.6, while this job installs current release wheels.
on:
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # the project targets the current Python and requires it
                python-version: ["3.14"]
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install (CPU-only torch, to keep the runner light)
              run: |
                  python -m pip install --upgrade pip
                  pip install torch --index-url https://download.pytorch.org/whl/cpu
                  pip install -e ".[jax,torch,test]"

            - name: Lint and format check
              run: |
                  pip install ruff
                  ruff check .
                  ruff format --check .

            # The `slow` marker covers the torch.compile test; the "slow" job below
            # runs everything.
            - name: Run the fast suite
              run: pytest -m "not slow"

    slow:
        # The full suite, slow tests included.
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            # full history: hatch-vcs derives the version from git
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - uses: actions/setup-python@v6
              with:
                  python-version: "3.14"

            - name: Install (CPU-only torch, to keep the runner light)
              run: |
                  python -m pip install --upgrade pip
                  pip install torch --index-url https://download.pytorch.org/whl/cpu
                  pip install -e ".[jax,torch,test]"

            - name: Run the full suite
              run: pytest
