# The maintainer's standard Ruff configuration, vendored so that `ruff check` and `ruff format` with no arguments
# are correct here and in CI, plus two additions: the version file hatch-vcs writes at build time is excluded, and
# one per-file exception below.

line-length = 120
preview = true
respect-gitignore = false
target-version = "py314"
extend-exclude = ["src/softmaxfix/_version.py"]  # Generated by hatch-vcs, gitignored.

[analyze]
    preview = true

[format]
    docstring-code-format = true
    docstring-code-line-length = 100
    preview = true

[lint]
    ignore = ["F401", "I001"]
    preview = true
    task-tags = ["FIXME", "TODO", "MEMENTO"]

[lint.per-file-ignores]
    # Bitwise float equality is the subject under test here (exact zeros, powers of two, ±inf), not a mistake.
    "tests/**" = ["RUF069"]
